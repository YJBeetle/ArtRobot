name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libpixman-1-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libjpeg-dev \
            libwebp-dev \
            fonts-noto-cjk \
            file

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBuildTest=ON
          -DUseJsonTemplate=ON
          -DBuildArtRobotRender=ON
          -DUseOpenCV=OFF

      - name: Build
        run: cmake --build build-ci --parallel 4

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error

      - name: Render template
        working-directory: build-ci/tools/ArtRobotRender
        run: |
          ./ArtRobotRender -t png ThrowIt.json ThrowIt-output.png
          file ThrowIt-output.png | grep --quiet "PNG image data"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-output
          path: |
            build-ci/Testing/Temporary/LastTest.log
            build-ci/tools/ArtRobotRender/ThrowIt-output.png
          if-no-files-found: ignore
          retention-days: 7
